# Docker Compose override: connects to the mosquitto service container.
mqtt.broker=tcp://mosquitto:1883
data.file=/app/data/measures_v2.csv
data.limit=0
data.stride=2
sim.profiles=57
sim.interval=1000
sim.machine_id=motor-01
sim.topic_template=sensors/{machine_id}/telemetry
