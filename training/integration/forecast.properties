# Run from the training module directory. Models load once at startup.
models.directory=results/rolling_full_v1
legacy.models.directory=models
mqtt.broker=tcp://127.0.0.1:1883
mqtt.client.id=motor-forecast
# Match existing team thermal thresholds. Original ML models/model.properties is unchanged.
warning.temperature=80
critical.temperature=95
future.warning.temperature=80
