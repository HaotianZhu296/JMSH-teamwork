services:
  mqtt5:
    image: eclipse-mosquitto:latest
    container_name: mqtt5
    ports:
      - "1883:1883"
    volumes:
      - mqtt5_data:/mosquitto/data
      - mqtt5_log:/mosquitto/log
    restart: unless-stopped

  detection-alert:
    build:
      context: ./detection-alert
    container_name: detection-alert
    environment:
      MQTT_BROKER_URL: tcp://mqtt5:1883
    depends_on:
      - mqtt5
    volumes:
      - detection_alert_data:/app/data
    restart: unless-stopped

volumes:
  mqtt5_data:
  mqtt5_log:
  detection_alert_data:

networks:
  default:
    name: mqtt5-network