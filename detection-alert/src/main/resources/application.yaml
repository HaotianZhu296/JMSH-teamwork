spring:
  application:
    name: detection-alert
  datasource:
    url: jdbc:sqlite:./data/detection-alert.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

mqtt:
  broker-url: tcp://localhost:1883
  client-id: spring-detection-service
  topic: sensors/+/telemetry
  qos: 1
  completion-timeout: 5000
  username: detector
  password: detect_pass_2024

thresholds:
  airTemperature:
    warning: 75.0
    critical: 90.0
  processTemperature:
    warning: 80.0
    critical: 95.0
  rotationalSpeed:
    warning: 4000.0
    critical: 5500.0
  torque:
    warning: 0.8
    critical: 1.0
  toolWear:
    warning: 50.0
    critical: 75.0
  warningScore: 0.65
  criticalScore: 0.85

# TODO: temporarily added, not fully tested — targets pending offline evaluation
performance-targets:
  precision: 0.85
  recall: 0.90
  f1-score: 0.87
  max-detection-latency-ms: 2000
  max-end-to-end-latency-ms: 5000
  false-positive-rate: 0.10