# MQTT Topic ACLs — least-privilege per NIST SP 800-82
# Each client may only access topics required for its role.

# Sensor simulator: publish telemetry only
user simulator
topic write sensors/+/telemetry

# Detection service: read telemetry, write alerts
user detector
topic read sensors/#
topic write alerts/#

# Alert manager / event store: read alerts, write to log
user eventstore
topic read alerts/#
topic read sensors/#

# Dashboard: read-only access to everything
user dashboard
topic read sensors/#
topic read alerts/#
