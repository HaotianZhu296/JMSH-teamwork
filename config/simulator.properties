# Sensor simulator settings. Keys follow README.md "Pipeline configuration".
# Run from the project root so data.file resolves.
mqtt.broker=tcp://localhost:1883
# Electric Motor Temperature CSV (measures_v2.csv). Not committed: download from Kaggle.
data.file=data/measures_v2.csv
# Maximum readings to publish in total. 0 = all.
data.limit=0
# Keep every Nth row of a profile. The CSV is 2 Hz, so 2 gives 1 Hz.
data.stride=2
# Profile ids to replay, in order, comma separated (see data/profile_split.csv).
# Empty = the first profile in the file. Switching profile changes profile_id in the messages.
# Default 57 (validation): 7201 s at 1 Hz, reaches 131.6 °C, 1463 s >= 100 °C, 283 s >= 120 °C,
# so one run shows WARNING and CRITICAL without injection. Profiles 3 and 8 never exceed 46 °C.
sim.profiles=57
# Milliseconds between messages. 1000 = 1 Hz real time (profile 57 = 2 hours); 100 = 10x faster demo.
sim.interval=1000
sim.machine_id=motor-01
sim.topic_template=sensors/{machine_id}/telemetry
# How long to keep retrying one message while the broker is unreachable before giving up.
sim.reconnect_max_wait_ms=60000

# Scripted overheating for integration tests (off by default).
# Starting at the scenario.start-th published reading (0-based), stator_winding rises linearly
# from scenario.base_c to scenario.target_c (°C) over scenario.ramp readings, holds for
# scenario.hold readings, then dataset values resume.
# Leave scenario.base_c empty to ramp from the dataset's own value at the start (no jump).
scenario.enabled=false
scenario.start=100
scenario.ramp=120
scenario.hold=60
scenario.base_c=
scenario.target_c=125
